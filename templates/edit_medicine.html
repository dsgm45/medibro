{% extends "base.html" %}

{% block title %}Edit Medication - MediMind AI{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; padding: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);">
    <h2>Edit Medication Schedule</h2>
    <form method="POST" style="display: grid; gap: 16px; margin-top: 20px;">
        <div>
            <label style="display: block; font-weight: 600; margin-bottom: 4px;">Medication Name</label>
            <input type="text" name="name" value="{{ med.name }}" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border);">
        </div>
        <div>
            <label style="display: block; font-weight: 600; margin-bottom: 4px;">Dosage</label>
            <input type="text" name="dosage" value="{{ med.dosage }}" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border);">
        </div>
        <div>
            <label style="display: block; font-weight: 600; margin-bottom: 4px;">Reminder Time</label>
            <input type="time" name="reminder_time" value="{{ med.reminder_time }}" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border);">
        </div>
        <div>
            <label style="display: block; font-weight: 600; margin-bottom: 4px;">Special Instructions</label>
            <input type="text" name="instructions" value="{{ med.instructions or '' }}" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border);">
        </div>
        <div>
            <label style="display: block; font-weight: 600; margin-bottom: 4px;">Recurrence</label>
            <select name="recurrence" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border);">
                <option value="daily" {% if med.recurrence == 'daily' %}selected{% endif %}>Daily</option>
                <option value="specific_days" {% if med.recurrence == 'specific_days' %}selected{% endif %}>Specific Days</option>
            </select>
        </div>
        <div>
            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Days of Week (if specific):</label>
            <label><input type="checkbox" name="days_of_week" value="Mon" {% if 'Mon' in selected_days %}checked{% endif %}> Mon</label>
            <label><input type="checkbox" name="days_of_week" value="Wed" {% if 'Wed' in selected_days %}checked{% endif %}> Wed</label>
            <label><input type="checkbox" name="days_of_week" value="Fri" {% if 'Fri' in selected_days %}checked{% endif %}> Fri</label>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
            <a href="{{ url_for('dashboard') }}" style="padding: 10px 20px; border: 1px solid var(--border); border-radius: 6px; text-decoration: none; color: var(--text-dark);">Cancel</a>
            <button type="submit" style="padding: 10px 20px; border: none; border-radius: 6px; background: var(--primary); color: white; font-weight: 600; cursor: pointer;">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
