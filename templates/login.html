{% extends "base.html" %}
{% block title %}Log In - MediBro{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 60px auto; padding: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 2px 10px -4px rgba(30,35,51,0.1);">
    <h1 style="margin: 0 0 4px 0; font-size: 1.5rem; color: var(--text-dark);">Welcome back</h1>
    <p style="color: var(--text-sub); font-size: 0.9rem; margin-bottom: 24px;">Log in to MediBro</p>
    <form method="POST" style="display: grid; gap: 16px;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label style="display:block; font-weight:600; font-size:0.875rem; color: var(--text-dark); margin-bottom:4px;">Email
            <input type="email" name="email" required style="display: block; margin-top: 4px; width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background-color: var(--bg); color: var(--text-dark);"></label>
        </div>
        <div>
            <label style="display:block; font-weight:600; font-size:0.875rem; color: var(--text-dark); margin-bottom:4px;">Password
            <input type="password" name="password" required style="display: block; margin-top: 4px; width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background-color: var(--bg); color: var(--text-dark);"></label>
        </div>
        <button type="submit" style="padding:11px; border:none; border-radius:8px; background:var(--primary); color:#ffffff; font-weight:600; font-size: 0.95rem; cursor:pointer;">Log In</button>
    </form>
    <p style="margin-top:18px; font-size:0.875rem; color:var(--text-sub);">
        Don't have an account? <a href="{{ url_for('register') }}" style="color:var(--primary); font-weight:600; text-decoration:none;">Register</a>
    </p>
</div>
{% endblock %}
