<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediBro - Health Dashboard</title>
    <!-- Tailwind CSS & Chart.js & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- Top Navigation Bar -->
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="bg-teal-500 text-slate-900 p-2 rounded-lg font-black text-xl">MB</div>
            <span class="text-2xl font-bold tracking-tight text-teal-400">MediBro</span>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-slate-300 font-medium">
                <i class="fa-solid fa-user-circle text-teal-400 mr-1"></i> {{ session.get('user_name', 'Patient') }}
                <span class="ml-2 text-xs bg-teal-900 text-teal-300 px-2 py-0.5 rounded-full uppercase tracking-wider">{{ session.get('user_role', 'Patient') }}</span>
            </span>
            <a href="/logout" class="bg-red-500/20 hover:bg-red-500 text-red-300 hover:text-white px-3 py-1.5 rounded-lg text-sm transition">
                <i class="fa-solid fa-sign-out-alt mr-1"></i> Logout
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- Left Column: Vitals Chart & Form -->
        <div class="lg:col-span-2 space-y-8">
            
            <!-- Vitals Analytics Card -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-white flex items-center">
                        <i class="fa-solid fa-heart-pulse text-red-400 mr-2"></i> Vitals Analytics
                    </h2>
                    <span class="text-xs text-slate-400">Live PostgreSQL Sync</span>
                </div>
                <div class="h-64">
                    <canvas id="vitalsChart"></canvas>
                </div>
            </div>

            <!-- Log Vitals Form -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                <h3 class="text-lg font-bold text-white mb-4 flex items-center">
                    <i class="fa-solid fa-plus-circle text-teal-400 mr-2"></i> Log New Vital Reading
                </h3>
                <form action="/api/add-vital" method="POST" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Systolic (BP High)</label>
                        <input type="number" name="systolic" placeholder="120" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-teal-400">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Diastolic (BP Low)</label>
                        <input type="number" name="diastolic" placeholder="80" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-teal-400">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Heart Rate (BPM)</label>
                        <input type="number" name="heart_rate" placeholder="72" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-teal-400">
                    </div>
                    <div class="md:col-span-3">
                        <button type="submit" class="w-full bg-teal-500 hover:bg-teal-400 text-slate-900 font-bold py-2.5 rounded-xl transition shadow-lg shadow-teal-500/20">
                            Save Vitals Record
                        </button>
                    </div>
                </form>
            </div>

            <!-- Appointments Section -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                <h3 class="text-lg font-bold text-white mb-4 flex items-center">
                    <i class="fa-solid fa-calendar-check text-teal-400 mr-2"></i> Book Appointment
                </h3>
                <form action="/api/book-appointment" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Select Specialist</label>
                        <select name="doctor_name" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-teal-400">
                            <option value="Dr. Sarah Jenkins (Cardiology)">Dr. Sarah Jenkins (Cardiology)</option>
                            <option value="Dr. Rajesh Patel (General Physician)">Dr. Rajesh Patel (General Physician)</option>
                            <option value="Dr. Elena Rostova (Neurology)">Dr. Elena Rostova (Neurology)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Date</label>
                        <input type="date" name="date" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-teal-400">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Time Slot</label>
                        <input type="time" name="time" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-teal-400">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Notes / Symptoms</label>
                        <input type="text" name="notes" placeholder="Brief reason for consultation" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-teal-400">
                    </div>
                    <div class="md:col-span-2">
                        <button type="submit" class="w-full bg-teal-500 hover:bg-teal-400 text-slate-900 font-bold py-2.5 rounded-xl transition shadow-lg shadow-teal-500/20">
                            Confirm Booking
                        </button>
                    </div>
                </form>
            </div>

        </div>

        <!-- Right Column: MediBro AI Health Assistant -->
        <div class="space-y-8">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col h-[580px]">
                <div class="flex items-center space-x-3 pb-4 border-b border-slate-700">
                    <div class="bg-teal-500/20 text-teal-400 p-2.5 rounded-xl">
                        <i class="fa-solid fa-robot text-xl"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-white">MediBro AI Assistant</h3>
                        <p class="text-xs text-teal-400 flex items-center"><span class="w-2 h-2 bg-teal-400 rounded-full mr-1.5 animate-pulse"></span> Online & Ready</p>
                    </div>
                </div>

                <!-- Chat Box Messages -->
                <div id="chatBox" class="flex-1 overflow-y-auto py-4 space-y-3 text-sm pr-1">
                    <div class="bg-slate-700/50 p-3 rounded-2xl max-w-[85%] text-slate-200">
                        Hello! I am MediBro AI. Ask me about your health questions or symptoms!
                    </div>
                </div>

                <!-- Chat Input Form -->
                <form id="aiForm" class="flex space-x-2 pt-3 border-t border-slate-700">
                    <input type="text" id="aiInput" placeholder="Ask MediBro AI..." required class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-teal-400">
                    <button type="submit" class="bg-teal-500 hover:bg-teal-400 text-slate-900 font-bold px-4 py-2 rounded-xl transition">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>

    </div>

    <!-- Chart.js & AI Chat Logic -->
    <script>
        // Initialize Vitals Chart
        fetch('/api/vitals-chart-data')
            .then(res => res.json())
            .then(data => {
                const ctx = document.getElementById('vitalsChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.labels.length ? data.labels : ['No Data'],
                        datasets: [
                            { label: 'Systolic BP', data: data.systolic, borderColor: '#ef4444', backgroundColor: '#ef444420', fill: true, tension: 0.3 },
                            { label: 'Diastolic BP', data: data.diastolic, borderColor: '#3b82f6', backgroundColor: '#3b82f620', fill: true, tension: 0.3 },
                            { label: 'Heart Rate (BPM)', data: data.heart_rate, borderColor: '#2dd4bf', backgroundColor: '#2dd4bf20', fill: true, tension: 0.3 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { labels: { color: '#94a3b8' } } },
                        scales: {
                            x: { ticks: { color: '#64748b' }, grid: { color: '#334155' } },
                            y: { ticks: { color: '#64748b' }, grid: { color: '#334155' } }
                        }
                    }
                });
            });

        // AI Assistant Chat Form
        document.getElementById('aiForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('aiInput');
            const chatBox = document.getElementById('chatBox');
            const msg = input.value;
            if(!msg) return;

            // Render User Message
            chatBox.innerHTML += `<div class="bg-teal-500/20 text-teal-200 p-3 rounded-2xl max-w-[85%] ml-auto text-right">${msg}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Query Backend AI Endpoint
            fetch('/api/ai-assistant', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg })
            })
            .then(res => res.json())
            .then(data => {
                chatBox.innerHTML += `<div class="bg-slate-700/50 p-3 rounded-2xl max-w-[85%] text-slate-200">${data.reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        });
    </script>
</body>
</html>
